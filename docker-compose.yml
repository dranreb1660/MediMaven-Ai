version: "3.9"

services:
  rag-api:
    build: .
    image: medimaven/rag-api:1.1.0
    container_name: medimaven-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - ENABLE_MONITORING=True
      - ENABLE_CACHING=True
      # - REDIS_URL=redis://redis:6379/0
    volumes:
      - medimaven_models:/app/models   # persists weights between restarts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  medimaven_models:

