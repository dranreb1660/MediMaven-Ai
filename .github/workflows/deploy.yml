name: Deploy Frontend
on:
  push:
    branches: [main, test-deployment]  # Added test-deployment for testing
  workflow_dispatch:  # Allow manual triggering

env:
  AWS_REGION: us-east-1
  S3_BUCKET: medimaven-web
  CLOUDFRONT_DISTRIBUTION_ID: E3CAF6LNQB5FF0

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production  # Use GitHub environment for additional security
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests
        working-directory: ./frontend
        run: npm run test:unit

      - name: Build application
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3 (Simple - No Compression)
        run: |
          # Simple sync without compression for debugging
          aws s3 sync frontend/dist/ s3://${{ env.S3_BUCKET }} \
            --delete \
            --exclude "*.gz" --exclude "*.br" \
            --cache-control "public, max-age=300"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/service-worker.js" "/manifest.json"

      - name: Deployment summary
        run: |
          echo "🚀 Deployment completed successfully!"
          echo "📦 S3 Bucket: s3://${{ env.S3_BUCKET }}"
          echo "🌐 CloudFront Distribution: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}"
          echo "🔗 Website should be live at your domain"
