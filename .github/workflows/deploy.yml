name: Deploy Frontend
on:
  push:
    branches: [main]  # Added test-deployment for testing
  workflow_dispatch:  # Allow manual triggering

env:
  AWS_REGION: us-east-1
  S3_BUCKET: medimaven-web
  CLOUDFRONT_DISTRIBUTION_ID: E3CAF6LNQB5FF0

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production  # Use GitHub environment for additional security
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests
        working-directory: ./frontend
        run: npm run test:unit

      - name: Build application
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3 (Optimized with Compression)
        run: |
          # Upload non-compressed assets (images, etc) with long cache
          aws s3 sync frontend/dist/ s3://${{ env.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" --exclude "service-worker.js" \
            --exclude "*.js" --exclude "*.css" \
            --exclude "*.gz" --exclude "*.br"
          
          # Upload JS/CSS files as brotli compressed with proper encoding
          find frontend/dist -name "*.js.br" -o -name "*.css.br" | while read f; do
            key="${f#frontend/dist/}"
            original_key="${key%.br}"
            content_type=$(case $original_key in 
              *.js) echo 'application/javascript';;
              *.css) echo 'text/css';;
            esac)
            
            aws s3 cp "$f" "s3://${{ env.S3_BUCKET }}/$original_key" \
              --content-encoding br \
              --content-type "$content_type" \
              --cache-control "public, max-age=31536000, immutable"
          done
          
          # Upload HTML/SW with short cache (uncompressed)
          aws s3 sync frontend/dist/ s3://${{ env.S3_BUCKET }} \
            --exclude "*" --include "*.html" --include "service-worker.js" \
            --cache-control "public, max-age=300, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/service-worker.js" "/manifest.json"

      - name: Deployment summary
        run: |
          echo "🚀 Deployment completed successfully!"
          echo "📦 S3 Bucket: s3://${{ env.S3_BUCKET }}"
          echo "🌐 CloudFront Distribution: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}"
          echo "🔗 Website should be live at your domain"
