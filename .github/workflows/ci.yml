name: MediMaven CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  # Frontend Tests
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Lint
        working-directory: frontend
        run: npm run lint
      
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      
      - name: Unit tests
        working-directory: frontend
        run: npm test -- --run
      
      - name: Build
        working-directory: frontend
        run: npm run build

  # Backend Tests
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install aiosqlite
      
      - name: Run tests
        working-directory: backend
        run: |
          # Run tests from the tests directory only
          pytest tests/ -v --tb=short --cov=app --cov=services
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: sqlite+aiosqlite:///test.db
          JWT_SECRET: test-secret-key
          ENABLE_MONITORING: false

  # Simplified E2E for now
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
      - name: E2E Tests
        run: echo "E2E tests placeholder - implement when ready"

  # Comment out Docker and Deploy for now
